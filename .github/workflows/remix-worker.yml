name: Remix worker

on:
  push:
    branches: [main]
    paths: ['workers/remix/**', '.github/workflows/remix-worker.yml']
  pull_request:
    branches: [main]
    paths: ['workers/remix/**', '.github/workflows/remix-worker.yml']

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr
      - name: Offline worker and media regression tests
        env:
          RUN_REAL_MEDIA_TESTS: '1'
        run: python3 -m unittest discover -s workers/remix -t . -v
      - name: Build CPU runtime without model or credentials
        run: docker build --target runtime -t adex-remix:test workers/remix
      - name: Container offline tests
        run: docker run --rm --network none --entrypoint python3 adex-remix:test -m unittest discover -s . -v
      - name: Container offline render
        run: docker run --rm --network none adex-remix:test --job-file fixtures/job.json --simulate --out-dir /tmp/remix-smoke
